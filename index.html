<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Cyber Defense Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
      background: #060810;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      background: #080c18;
      border-right: 1px solid rgba(59,130,246,0.2);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(59,130,246,0.15);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .brand-logo {
      width: 24px; height: 24px; object-fit: contain;
    }
    .brand-label { font-size: 14px; letter-spacing: 1px; color: #cbd5e1; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
    #client-input {
      width: 100%; background: transparent;
      border: none; border-bottom: 1px dashed rgba(148,163,184,0.25);
      color: #e2e8f0; font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 700; padding: 3px 0; outline: none;
    }
    #client-input:focus { border-bottom-color: #3b82f6; }

    #legend-bar {
      display: flex; gap: 10px; align-items: center;
      padding: 7px 16px;
      border-bottom: 1px solid rgba(59,130,246,0.1);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #cbd5e1; }
    .leg-swatch { width: 11px; height: 11px; border-radius: 2px; }
    .leg-swatch.green { background: #166534; border: 1px solid #22c55e; }
    .leg-swatch.blue  { background: #1e3a8a; border: 1px solid #3b82f6; }
    .leg-swatch.red   { background: #7f1d1d; border: 1px solid #ef4444; }

    #search-wrap {
      padding: 7px 12px;
      border-bottom: 1px solid rgba(59,130,246,0.1);
      flex-shrink: 0;
    }
    #search {
      width: 100%; background: rgba(15,23,42,0.8);
      border: 1px solid rgba(59,130,246,0.2); border-radius: 4px;
      padding: 7px 11px; color: #94a3b8;
      font-family: 'IBM Plex Mono', monospace; font-size: 14px; outline: none;
    }
    #search:focus { border-color: #3b82f6; color: #e2e8f0; }
    #search::placeholder { color: #334155; }

    #solution-checkboxes {
      list-style: none; overflow-y: auto; flex: 1; padding: 4px 0;
    }
    #solution-checkboxes::-webkit-scrollbar { width: 4px; }
    #solution-checkboxes::-webkit-scrollbar-track { background: #0d1117; }
    #solution-checkboxes::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 2px; }

    #solution-checkboxes li {
      display: flex; align-items: center;
      padding: 4px 12px;
      border-bottom: 1px solid rgba(30,58,138,0.1);
      gap: 6px; transition: background 0.1s;
    }
    #solution-checkboxes li:hover { background: rgba(30,58,138,0.12); }
    #solution-checkboxes li.hidden-item { display: none; }

    /* CSF 2.0 function / asset-class group headers */
    #solution-checkboxes li.group-head {
      position: sticky; top: 0; z-index: 2;
      justify-content: space-between;
      background: #0d1424;
      border-top: 1px solid rgba(59,130,246,0.25);
      border-bottom: 1px solid rgba(59,130,246,0.25);
      padding: 5px 12px;
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: #7dd3fc; cursor: default;
    }
    #solution-checkboxes li.group-head:hover { background: #0d1424; }
    .group-count {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      letter-spacing: 0; color: #64748b;
    }

    .sol-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .sol-label {
      font-size: 12.5px; color: #cbd5e1; line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.15s;
    }
    /* Grouped market terminology for the same capability */
    .sol-alias {
      font-size: 10px; color: #5b6b84; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    li.active-green .sol-label { color: #4ade80; }
    li.active-blue  .sol-label { color: #93c5fd; }
    li.active-red   .sol-label { color: #fca5a5; }
    li.active-green .sol-alias,
    li.active-blue  .sol-alias,
    li.active-red   .sol-alias { color: #7c8ba3; }

    #group-switch { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
    .group-switch-label {
      font-size: 11px; letter-spacing: 1px; color: #475569;
      text-transform: uppercase; margin-right: 2px;
    }
    .group-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      background: transparent; border: 1px solid rgba(59,130,246,0.2);
      color: #64748b; border-radius: 3px; padding: 3px 8px; cursor: pointer;
      transition: all 0.12s;
    }
    .group-btn:hover { border-color: rgba(59,130,246,0.45); color: #93c5fd; }
    .group-btn.on { background: rgba(30,58,138,0.4); border-color: #3b82f6; color: #bfdbfe; }

    /* Sidebar hover highlights the matching bar in the matrix */
    #labels g.bar-hover rect { stroke: #fbbf24; stroke-width: 2; }

    /* Radio dots */
    .radio-group { display: flex; gap: 4px; flex-shrink: 0; }
    .radio-group input[type="radio"] { display: none; }
    .radio-group label {
      display: block; width: 14px; height: 14px; border-radius: 3px;
      cursor: pointer; border: 1px solid transparent; transition: all 0.12s;
    }
    .lbl-off   { background: rgba(100,116,139,0.25); border-color: rgba(100,116,139,0.35) !important; }
    .lbl-green { background: rgba(22,101,52,0.45);   border-color: #22c55e !important; }
    .lbl-blue  { background: rgba(30,58,138,0.45);   border-color: #3b82f6 !important; }
    .lbl-red   { background: rgba(127,29,29,0.45);   border-color: #ef4444 !important; }
    input[type="radio"]:checked + label { transform: scale(1.2); box-shadow: 0 0 5px rgba(255,255,255,0.3); }

    /* ── MAIN ── */
    #main { overflow: auto; padding: 18px 12px; display: flex; flex-direction: column; }
    #title-bar { margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
    #title-bar h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 24px; font-weight: 700; color: #e2e8f0; letter-spacing: 2px;
    }
    #title-bar span { font-size: 13px; color: #cbd5e1; letter-spacing: 2px; }

    #templates-bar {
      margin-bottom: 16px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; max-width: 920px;
    }
    .template-group {
      display: flex; flex-direction: column; gap: 6px;
    }
    .template-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
      background: rgba(30,58,138,0.25); border: 1px solid rgba(59,130,246,0.35);
      color: #93c5fd; border-radius: 4px; padding: 8px 14px;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .template-btn:hover { background: rgba(30,58,138,0.4); }
    .template-btn:active { transform: scale(0.97); }
    .template-btn.clear-btn {
      background: rgba(239,68,68,0.25); border-color: rgba(239,68,68,0.35);
      color: #fca5a5;
    }
    .template-btn.clear-btn:hover { background: rgba(239,68,68,0.4); }
    .template-colors {
      display: flex; gap: 4px;
    }
    .color-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      border: none; border-radius: 3px; padding: 4px 10px;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .gap-btn { background: rgba(239,68,68,0.25); color: #fca5a5; }
    .gap-btn:hover { background: rgba(239,68,68,0.4); }
    .current-btn { background: rgba(30,58,138,0.25); color: #93c5fd; }
    .current-btn:hover { background: rgba(30,58,138,0.4); }
    .planned-btn { background: rgba(22,101,52,0.25); color: #4ade80; }
    .planned-btn:hover { background: rgba(22,101,52,0.4); }
    .color-btn:active { transform: scale(0.95); }

    #svg-wrap {
      background: #000;
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 4px; overflow: visible; max-width: 920px;
    }

    #stats-bar {
      margin-top: 12px; display: flex; gap: 40px; align-items: flex-start; justify-content: space-between; max-width: 920px;
    }
    .clear-all-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700;
      background: rgba(239,68,68,0.25); border: 2px solid rgba(239,68,68,0.35);
      color: #fca5a5; border-radius: 6px; padding: 18px 32px;
      cursor: pointer; transition: background 0.15s;
      flex-shrink: 0;
    }
    .clear-all-btn:hover { background: rgba(239,68,68,0.4); }
    .clear-all-btn:active { transform: scale(0.97); }
    #stats-pills {
      display: flex; flex-direction: column; gap: 10px; flex: 1;
    }
    #stats-pills > div {
      display: flex; gap: 8px; align-items: center;
    }
    .stat-pill { font-size: 13px; border-radius: 4px; padding: 5px 14px; border: 1px solid; }
    .stat-green { background: rgba(22,101,52,0.25);  border-color: rgba(34,197,94,0.35);  color: #4ade80; }
    .stat-blue  { background: rgba(30,58,138,0.25);  border-color: rgba(59,130,246,0.35); color: #93c5fd; }
    .stat-red   { background: rgba(127,29,29,0.25);  border-color: rgba(239,68,68,0.35);  color: #fca5a5; }
    .stat-off   { background: rgba(30,30,60,0.25);   border-color: rgba(100,116,139,0.3); color: #cbd5e1; }
    #export-bar-inner {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .export-label { font-size: 13px; letter-spacing: 2px; color: #cbd5e1; text-transform: uppercase; }
    .export-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      background: rgba(30,58,138,0.2); border: 1px solid rgba(59,130,246,0.35);
      color: #93c5fd; border-radius: 4px; padding: 6px 16px;
      cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 6px;
    }
    .export-btn:hover { background: rgba(30,58,138,0.45); }
    .export-btn:active { transform: scale(0.97); }
    #export-status {
      font-size: 12px; color: #4ade80; letter-spacing: 1px;
      opacity: 0; transition: opacity 0.3s;
    }
    #export-status.show { opacity: 1; }
    #export-error { font-size: 12px; color: #fca5a5; letter-spacing: 1px; display: none; }
    #export-error.show { display: inline; }
    @media print {
      body { grid-template-columns: 1fr; background: #000; }
      #sidebar, #stats-bar, #export-bar, #title-bar { display: none !important; }
      #main { padding: 10px; }
      #svg-wrap { border: none; }
    }
  </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside id="sidebar">
  <div id="sidebar-header">
    <div class="brand">
      <img src="../favicon-192.png" alt="Mason SC" class="brand-logo" />
      <span class="brand-label">Mason SC</span>
    </div>
    <input id="client-input" type="text" placeholder="Client Name" title="Click to edit" />
  </div>

  <div id="legend-bar">
    <div class="leg"><div class="leg-swatch blue"></div>Current</div>
    <div class="leg"><div class="leg-swatch green"></div>Planned</div>
    <div class="leg"><div class="leg-swatch red"></div>Gap</div>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="Filter by name, acronym or CSF ID…" />
    <div id="group-switch">
      <span class="group-switch-label">Group</span>
      <button class="group-btn on" data-mode="fn"    title="Group by CSF 2.0 Function">Function</button>
      <button class="group-btn"    data-mode="asset" title="Group by asset class">Asset</button>
      <button class="group-btn"    data-mode="az"    title="Flat A–Z list">A–Z</button>
    </div>
  </div>

  <ul id="solution-checkboxes"></ul>
</aside>

<!-- ── MAIN ── -->
<main id="main">
  <div id="title-bar">
    <h2>CYBER DEFENSE MATRIX</h2>
    <span>NIST CSF 2.0 × ASSET CLASS</span>
  </div>

  <div id="templates-bar">
    <div class="template-group">
      <button class="template-btn" onclick="applyTemplate('tableStakes', 'red')">Table Stakes</button>
      <div class="template-colors">
        <button class="color-btn current-btn" onclick="applyTemplate('tableStakes', 'blue')" title="Current">Current</button>
        <button class="color-btn planned-btn" onclick="applyTemplate('tableStakes', 'green')" title="Planned">Planned</button>
        <button class="color-btn gap-btn" onclick="applyTemplate('tableStakes', 'red')" title="Gap">Gap</button>
      </div>
    </div>
    <div class="template-group">
      <button class="template-btn" onclick="applyTemplate('gettingInsurance', 'red')">Insurance Ready</button>
      <div class="template-colors">
        <button class="color-btn current-btn" onclick="applyTemplate('gettingInsurance', 'blue')" title="Current">Current</button>
        <button class="color-btn planned-btn" onclick="applyTemplate('gettingInsurance', 'green')" title="Planned">Planned</button>
        <button class="color-btn gap-btn" onclick="applyTemplate('gettingInsurance', 'red')" title="Gap">Gap</button>
      </div>
    </div>
    <div class="template-group">
      <button class="template-btn" onclick="applyTemplate('industryAverage', 'red')">Industry Average</button>
      <div class="template-colors">
        <button class="color-btn current-btn" onclick="applyTemplate('industryAverage', 'blue')" title="Current">Current</button>
        <button class="color-btn planned-btn" onclick="applyTemplate('industryAverage', 'green')" title="Planned">Planned</button>
        <button class="color-btn gap-btn" onclick="applyTemplate('industryAverage', 'red')" title="Gap">Gap</button>
      </div>
    </div>
    <div class="template-group">
      <button class="template-btn" onclick="applyTemplate('regionalBankStandard', 'red')">Regulated / Bank</button>
      <div class="template-colors">
        <button class="color-btn current-btn" onclick="applyTemplate('regionalBankStandard', 'blue')" title="Current">Current</button>
        <button class="color-btn planned-btn" onclick="applyTemplate('regionalBankStandard', 'green')" title="Planned">Planned</button>
        <button class="color-btn gap-btn" onclick="applyTemplate('regionalBankStandard', 'red')" title="Gap">Gap</button>
      </div>
    </div>
  </div>

  <div id="svg-wrap">
    <svg cursor="default" height="594.50000" id="owasp-chart" width="889.51752" version="1.1"
      preserveAspectRatio="xMidYMid" style="background-color: black"
      viewBox="0 0 889.51752 594.50000" xmlns="http://www.w3.org/2000/svg">
      <title>Cyber Defense Matrix</title>
      <defs/>

      <!-- GRID -->
      <g id="grid" transform="matrix(1.0950292,0,0,1,-3.7184358e-6,-0.92485547)">
        <text stroke="none" stroke-width="1px" x="76.69315" font-family="Helvetica" fill="#ffffff" font-size="14px" y="114.92486" text-anchor="middle">DEVICES</text>
        <text stroke="none" stroke-width="1px" x="83.47315" font-family="Helvetica" fill="#ffffff" font-size="14px" y="543.92487" text-anchor="middle">USERS</text>
        <text stroke="none" stroke-width="1px" x="91.38315" font-family="Helvetica" fill="#ffffff" font-size="14px" y="437.92487" text-anchor="middle">DATA</text>
        <text stroke="none" stroke-width="1px" x="65.39315" font-family="Helvetica" fill="#ffffff" font-size="14px" y="329.92485" text-anchor="middle">NETWORKS</text>
        <text stroke="none" stroke-width="1px" x="54.09314" font-family="Helvetica" fill="#ffffff" font-size="14px" y="221.92485" text-anchor="middle">APPLICATIONS</text>
        <text stroke="none" stroke-width="1px" x="750.17314"  font-family="Helvetica" fill="#ffffff" font-size="14px" y="44.924854" text-anchor="middle">RECOVER</text>
        <text stroke="none" stroke-width="1px" x="636.04314"  font-family="Helvetica" fill="#ffffff" font-size="14px" y="43.924854" text-anchor="middle">RESPOND</text>
        <text stroke="none" stroke-width="1px" x="521.91314"  font-family="Helvetica" fill="#ffffff" font-size="14px" y="43.924854" text-anchor="middle">DETECT</text>
        <text stroke="none" stroke-width="1px" x="407.78314"  font-family="Helvetica" fill="#ffffff" font-size="14px" y="42.924854" text-anchor="middle">PROTECT</text>
        <text stroke="none" stroke-width="1px" x="295.91314"  font-family="Helvetica" fill="#ffffff" font-size="14px" y="42.924854" text-anchor="middle">IDENTIFY</text>
        <text stroke="none" stroke-width="1px" x="179.52314"  font-family="Helvetica" fill="#ffffff" font-size="14px" y="43.924854" text-anchor="middle">GOVERN</text>
        <line stroke="#ffffff" y1="162.92485" x1="126.41315" stroke-width="3px" y2="162.92485" x2="805.54314"/>
        <line stroke="#ffffff" y1="268.92485" x1="126.41315" stroke-width="3px" y2="268.92485" x2="805.54314"/>
        <line stroke="#ffffff" y1="374.92487" x1="126.41315" stroke-width="3px" y2="374.92487" x2="805.54314"/>
        <line stroke="#ffffff" y1="480.92487" x1="125.28315" stroke-width="3px" y2="480.92487" x2="805.54314"/>
        <line stroke="#ffffff" y1="56.924854" x1="239.41314" stroke-width="3px" y2="587.92487" x2="239.41314"/>
        <line stroke="#ffffff" y1="57.924854" x1="352.41314" stroke-width="3px" y2="587.92487" x2="352.41314"/>
        <line stroke="#ffffff" y1="56.924854" x1="465.41314" stroke-width="3px" y2="587.92487" x2="465.41314"/>
        <line stroke="#ffffff" y1="57.924854" x1="578.41314" stroke-width="3px" y2="587.92487" x2="578.41314"/>
        <line stroke="#ffffff" y1="56.924854" x1="691.41314" stroke-width="3px" y2="587.92487" x2="691.41314"/>
        <rect stroke="#ffffff" x="126.41041" height="530.00000" y="56.924854" stroke-width="3px" width="678.00274" fill="none"/>
      </g>

      <!-- CONTROLS -->
      <!-- Control bars are generated from CONTROLS by layoutControls(). -->
      <g id="labels"></g>
    </svg>
  </div>

  <div id="stats-bar">
    <button class="clear-all-btn" onclick="clearAll()">Clear All</button>
    <div id="stats-pills">
      <div>
        <span class="stat-pill stat-blue"  id="stat-blue">● 0 Current</span>
        <span class="stat-pill stat-green" id="stat-green">● 0 Planned</span>
        <span class="stat-pill stat-red"   id="stat-red">● 0 Gap</span>
        <span class="stat-pill stat-off"   id="stat-off">● 0 Off</span>
      </div>
      <div id="export-bar-inner">
        <span class="export-label">Export:</span>
        <button class="export-btn" onclick="exportPNG()">&#11015; PNG</button>
        <button class="export-btn" onclick="exportPDF()">&#11015; PDF</button>
        <button class="export-btn" onclick="exportJSON()">&#11015; JSON</button>
        <button class="export-btn" onclick="triggerLoadJSON()">&#11014; Load JSON</button>
        <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="loadFromJSON(event)">
        <span id="export-status">&#10003; Downloaded</span>
        <span id="export-error"></span>
      </div>
    </div>
  </div>

</main>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CONTROL LIBRARY — NIST CSF 2.0

   Columns are the six CSF 2.0 Functions (Govern, Identify, Protect, Detect,
   Respond, Recover); rows are the Cyber Defense Matrix asset classes.

     fn    : Function column index — 0 GV, 1 ID, 2 PR, 3 DE, 4 RS, 5 RC
     rows  : 'all' for a program-wide control (drawn as a vertical band),
             otherwise [firstRow, lastRow] over
             0 Devices, 1 Applications, 2 Networks, 3 Data, 4 Users
     alias : grouped market terminology for the same capability — these are
             searchable and shown on the control, so a matrix stays readable
             whether the client says "SSE", "SWG" or "CASB"
     csf   : the CSF 2.0 Categories the control primarily supports
   ══════════════════════════════════════════════════════════════════════════ */
const CONTROLS = [
  /* ── GOVERN ───────────────────────────────────────────────────────── */
  { id:'securityLeadership', label:'Security Leadership', fn:0, rows:'all',
    alias:['vCISO','CISO-as-a-Service','Security Program Management','Roles & Responsibilities'], csf:['GV.OC','GV.RR'] },
  { id:'cyberRiskMgmt', label:'Cyber Risk Management', fn:0, rows:'all',
    alias:['Risk Register','Cyber Risk Quantification (CRQ)','FAIR','Risk Appetite','Risk Assessment'], csf:['GV.RM','ID.RA'] },
  { id:'policyStandards', label:'Policy & Standards', fn:0, rows:'all',
    alias:['Policy Management','Control Framework','Standards & Baselines','Exception Management'], csf:['GV.PO'] },
  { id:'grcAssurance', label:'GRC & Assurance', fn:0, rows:'all',
    alias:['Integrated Risk Management (IRM)','Compliance Automation','Continuous Control Monitoring','Audit Readiness','Controls Assurance'], csf:['GV.OV','GV.PO'] },
  { id:'supplyChainRisk', label:'Third-Party & Supply Chain Risk', fn:0, rows:'all',
    alias:['TPRM','C-SCRM','Vendor Risk Management','Fourth-Party Risk','SIG / CAIQ'], csf:['GV.SC'] },

  /* ── IDENTIFY ─────────────────────────────────────────────────────── */
  { id:'attackSurfaceMgmt', label:'Attack Surface Management', fn:1, rows:'all',
    alias:['EASM','CAASM','ASM','Shadow IT Discovery','External Exposure'], csf:['ID.AM','ID.RA'] },
  { id:'exposureManagement', label:'Exposure Management', fn:1, rows:'all',

/* ══════════════════════════════════════════════════════════════════════════
   MATRIX GEOMETRY & AUTO-LAYOUT

   Bars are generated from CONTROLS rather than hand-placed, so adding or
   renaming a control needs no SVG edits. Program-wide controls become
   vertical bands filling their Function column; asset-specific controls
   become horizontal bars packed into lanes inside their cell. The packer
   guarantees no two bars overlap.
   ══════════════════════════════════════════════════════════════════════════ */
const GRID = {
  x0: 138.4232, colW: 123.7387, y0: 56, rowH: 106,
  functions: ['Govern', 'Identify', 'Protect', 'Detect', 'Respond', 'Recover'],
  assets:    ['Devices', 'Applications', 'Networks', 'Data', 'Users']
};
const PAD = 4, V_BAR_W = 14, V_GAP = 2.5, V_INSET = 7;
const ROW_PAD = 5, MAX_LANE_H = 20, LANE_GAP = 3, BAR_LINE_H = 17;
const MIN_FONT = 6.8, MAX_FONT = 9.5, WRAP_FONT = 7.3, CHAR_W = 0.55;

/* Split a label into exactly n lines, minimising the longest one. */
function wrapLabel(label, n) {
  const words = label.split(/\s+/);
  if (n === 1) return [label];
  if (words.length < n) return null;
  let best = null;
  (function walk(i, parts) {
    if (parts.length === n - 1) {
      const rest = words.slice(i).join(' ');
      if (!rest) return;
      const lines = parts.concat(rest);
      const score = Math.max.apply(null, lines.map(l => l.length));
      if (!best || score < best.score) best = { lines: lines, score: score };
      return;
    }
    for (let j = i + 1; j <= words.length - (n - parts.length - 1); j++)
      walk(j, parts.concat(words.slice(i, j).join(' ')));
  })(0, []);
  return best ? best.lines : null;
}

/* Fewest lines that keep the label legible inside width w. */
function fitText(label, w) {
  const usable = w - 7;
  const widest = ls => Math.max.apply(null, ls.map(l => l.length));
  for (let n = 1; n <= 3; n++) {
    const lines = wrapLabel(label, n);
    if (!lines) continue;
    const f = usable / (CHAR_W * widest(lines));
    if (f >= (n === 1 ? WRAP_FONT : MIN_FONT))
      return { lines: lines, font: Math.min(MAX_FONT, f) };
  }
  const lines = wrapLabel(label, 3) || wrapLabel(label, 2) || [label];
  const f = usable / (CHAR_W * widest(lines));
  return { lines: lines, font: Math.max(MIN_FONT, Math.min(MAX_FONT, f)) };
}

function layoutControls() {
  const nCols = GRID.functions.length, nRows = GRID.assets.length;
  const placed = [], vZone = new Array(nCols).fill(null);

  // 1 — program-wide controls become vertical bands.
  for (let c = 0; c < nCols; c++) {
    const bands = CONTROLS.filter(k => k.fn === c && k.rows === 'all');
    if (!bands.length) continue;
    const hasRowBars = CONTROLS.some(k => k.fn === c && k.rows !== 'all');
    const left = GRID.x0 + c * GRID.colW + PAD;
    const pitch = hasRowBars ? V_BAR_W + V_GAP : (GRID.colW - 2 * PAD) / bands.length;
    const barW  = hasRowBars ? V_BAR_W : pitch - V_GAP;
    const y = GRID.y0 + V_INSET, h = nRows * GRID.rowH - 2 * V_INSET;
    bands.forEach((k, i) => placed.push({
      ctl: k, vertical: true, x: left + i * pitch, y: y, w: barW, h: h,
      text: fitText(k.label, h * 0.85)
    }));
    vZone[c] = { x1: left, x2: left + bands.length * pitch - V_GAP };
  }

  // 2 — asset-specific controls take the widest run of their column span
  //     that no vertical band already occupies.
  function freeSpan(c1, c2) {
    const full = [GRID.x0 + c1 * GRID.colW + PAD, GRID.x0 + (c2 + 1) * GRID.colW - PAD];
    let segs = [full];
    for (let c = c1; c <= c2; c++) {
      const b = vZone[c];
      if (!b) continue;
      const next = [];
      segs.forEach(function(s) {
        if (b.x2 <= s[0] || b.x1 >= s[1]) { next.push(s); return; }
        if (b.x1 - 2 > s[0]) next.push([s[0], b.x1 - 2]);
        if (b.x2 + 2 < s[1]) next.push([b.x2 + 2, s[1]]);
      });
      segs = next;
    }
    segs.sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]));
    return segs[0] || full;
  }

  const lanes = [];
  for (let r = 0; r < nRows; r++) lanes.push([]);
  function claim(r1, r2, n, x1, x2) {
    for (let L = 0; L < 40; L++) {
      let ok = true;
      for (let r = r1; r <= r2 && ok; r++)
        for (let l = L; l < L + n && ok; l++) {
          lanes[r][l] = lanes[r][l] || [];
          if (lanes[r][l].some(s => !(x2 <= s[0] || x1 >= s[1]))) ok = false;
        }
      if (!ok) continue;
      for (let r = r1; r <= r2; r++)
        for (let l = L; l < L + n; l++) lanes[r][l].push([x1, x2]);
      return L;
    }
    return 0;
  }

  CONTROLS.filter(k => k.rows !== 'all').forEach(function(k) {
    const cols = Array.isArray(k.fn) ? k.fn : [k.fn, k.fn];
    const span = freeSpan(cols[0], cols[1]);
    const text = fitText(k.label, span[1] - span[0]);
    placed.push({
      ctl: k, vertical: false, x: span[0], w: span[1] - span[0],
      r1: k.rows[0], r2: k.rows[1], cell: cols[0] + '-' + cols[1],
      lane: claim(k.rows[0], k.rows[1], text.lines.length, span[0], span[1]),
      span: text.lines.length, text: text
    });
  });

  // 3 — lane height is uniform per asset row so bars line up across the
  //     matrix; each cell's own stack is then centred inside its row.
  const rowLaneH = lanes.map(ls =>
    Math.min(MAX_LANE_H, (GRID.rowH - 2 * ROW_PAD) / (ls.length || 1)));
  const bars = placed.filter(p => !p.vertical), cellLanes = {};
  bars.forEach(function(p) {
    for (let r = p.r1; r <= p.r2; r++) {
      const key = r + ':' + p.cell;
      cellLanes[key] = Math.max(cellLanes[key] || 0, p.lane + p.span);
    }
  });
  const cellTop = (r, cell) =>
    GRID.y0 + r * GRID.rowH + (GRID.rowH - cellLanes[r + ':' + cell] * rowLaneH[r]) / 2;
  bars.forEach(function(p) {
    const yTop = cellTop(p.r1, p.cell) + p.lane * rowLaneH[p.r1];
    const yBot = cellTop(p.r2, p.cell) + (p.lane + p.span) * rowLaneH[p.r2];
    p.h = Math.min(yBot - yTop - LANE_GAP, p.span * BAR_LINE_H);
    p.y = yTop + (yBot - yTop - p.h) / 2;
  });
  return placed;
}

/* ── Draw the bars into the SVG ─────────────────────────────────────────── */
const SVG_NS = 'http://www.w3.org/2000/svg';
const PLACED = layoutControls();

(function drawBars() {
  const layer = document.getElementById('labels');
  PLACED.forEach(function(p) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('id', p.ctl.id);
    g.setAttribute('class', 'ctl-bar');

    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', p.x.toFixed(2));
    rect.setAttribute('y', p.y.toFixed(2));
    rect.setAttribute('width', p.w.toFixed(2));
    rect.setAttribute('height', p.h.toFixed(2));
    rect.setAttribute('rx', '2');
    rect.setAttribute('stroke-width', '1');
    g.appendChild(rect);

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('font-family', 'Helvetica, Arial, sans-serif');
    text.setAttribute('font-size', p.text.font.toFixed(2));
    text.setAttribute('text-anchor', 'middle');
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2, lh = p.text.font * 1.15;
    if (p.vertical) {
      // rotate(-90) maps local (x,y) to screen (y,-x): text reads bottom-up.
      text.setAttribute('transform', 'rotate(-90)');
      text.setAttribute('x', (-cy).toFixed(2));
      text.setAttribute('y', (cx + p.text.font * 0.35).toFixed(2));
      text.textContent = p.text.lines[0];
    } else {
      const top = cy - (p.text.lines.length - 1) * lh / 2 + p.text.font * 0.35;
      text.setAttribute('x', cx.toFixed(2));
      text.setAttribute('y', top.toFixed(2));
      p.text.lines.forEach(function(line, i) {
        const ts = document.createElementNS(SVG_NS, 'tspan');
        ts.setAttribute('x', cx.toFixed(2));
        if (i) ts.setAttribute('dy', lh.toFixed(2));
        ts.textContent = line;
        text.appendChild(ts);
      });
    }
    g.appendChild(text);
    layer.appendChild(g);
  });
})();

function applyState(id) {
  const color = state[id], g = document.getElementById(id);
  if (!g) return;
  const rect = g.querySelector('rect'), text = g.querySelector('text');
  if (color === 'off') {
    rect.style.display = 'none';
    if (text) text.style.display = 'none';
    return;
  }
  rect.style.display = '';
  if (text) text.style.display = '';
  rect.setAttribute('fill', COLOR_FILLS[color]);
  rect.setAttribute('stroke', COLOR_STROKES[color]);
  if (text) text.style.fill = '#f8fafc';
}

function updateStats() {
  const counts = { green: 0, blue: 0, red: 0, off: 0 };
  CONTROLS.forEach(c => counts[state[c.id]]++);
  document.getElementById('stat-blue').textContent  = '● ' + counts.blue  + ' Current';
  document.getElementById('stat-green').textContent = '● ' + counts.green + ' Planned';
  document.getElementById('stat-red').textContent   = '● ' + counts.red   + ' Gap';
  document.getElementById('stat-off').textContent   = '● ' + counts.off   + ' Off';
}

/* ── Sidebar ────────────────────────────────────────────────────────────── */
const STATUS_OPTS = [
  { val: 'off',   cls: 'lbl-off',   title: 'Not applicable' },
  { val: 'blue',  cls: 'lbl-blue',  title: 'Current' },
  { val: 'green', cls: 'lbl-green', title: 'Planned' },
  { val: 'red',   cls: 'lbl-red',   title: 'Gap' }
];
const ul = document.getElementById('solution-checkboxes');
let groupMode = 'fn';

function assetLabel(ctl) {
  if (ctl.rows === 'all') return 'All Assets';
  return ctl.rows[0] === ctl.rows[1]
    ? GRID.assets[ctl.rows[0]]
    : GRID.assets[ctl.rows[0]] + '–' + GRID.assets[ctl.rows[1]];
}

function groupsFor(mode) {
  if (mode === 'az') return [{ name: 'All Controls',
    items: CONTROLS.slice().sort((a, b) => a.label.localeCompare(b.label)) }];
  if (mode === 'asset') {
    const order = GRID.assets.concat('All Assets');
    return order.map(name => ({ name: name,
      items: CONTROLS.filter(c => assetLabel(c) === name) }))
      .filter(g => g.items.length);
  }
  return GRID.functions.map((name, i) => ({ name: name,
    items: CONTROLS.filter(c => c.fn === i) })).filter(g => g.items.length);
}

function buildRow(ctl) {
  const li = document.createElement('li');
  li.id = 'li-' + ctl.id;
  li.className = state[ctl.id] !== 'off' ? 'active-' + state[ctl.id] : '';
  li.title = ctl.label + '\n' + GRID.functions[ctl.fn].toUpperCase() + ' · ' +
    assetLabel(ctl) + '\nCSF 2.0: ' + ctl.csf.join(', ') +
    '\nAlso known as: ' + ctl.alias.join(', ');

  const txt = document.createElement('div');
  txt.className = 'sol-text';
  const lbl = document.createElement('span');
  lbl.className = 'sol-label';
  lbl.textContent = ctl.label;
  const sub = document.createElement('span');
  sub.className = 'sol-alias';
  sub.textContent = ctl.alias.slice(0, 3).join(' · ');
  txt.appendChild(lbl);
  txt.appendChild(sub);
  li.appendChild(txt);

  const rg = document.createElement('div');
  rg.className = 'radio-group';
  STATUS_OPTS.forEach(function(opt) {
    const inp = document.createElement('input');
    inp.type = 'radio';
    inp.name = ctl.id + '-color';
    inp.id = ctl.id + '-' + opt.val;
    inp.value = opt.val;
    inp.checked = state[ctl.id] === opt.val;
    inp.addEventListener('change', function() { setStatus(ctl.id, opt.val); });
    const dot = document.createElement('label');
    dot.htmlFor = inp.id;
    dot.className = opt.cls;
    dot.title = opt.title;
    rg.appendChild(inp);
    rg.appendChild(dot);
  });
  li.appendChild(rg);

  const bar = document.getElementById(ctl.id);
  li.addEventListener('mouseenter', () => bar && bar.classList.add('bar-hover'));
  li.addEventListener('mouseleave', () => bar && bar.classList.remove('bar-hover'));
  return li;
}

function renderList() {
  ul.innerHTML = '';
  groupsFor(groupMode).forEach(function(group) {
    const head = document.createElement('li');
    head.className = 'group-head';
    head.dataset.group = group.name;
    head.innerHTML = '<span>' + group.name + '</span><span class="group-count">' +
      group.items.length + '</span>';
    ul.appendChild(head);
    const items = group.items.slice().sort(function(a, b) {
      const sa = state[a.id] !== 'off', sb = state[b.id] !== 'off';
      if (sa !== sb) return sa ? -1 : 1;
      return a.label.localeCompare(b.label);
    });
    items.forEach(c => ul.appendChild(buildRow(c)));
  });
  applyFilter();
}

function setStatus(id, val) {
  state[id] = val;
  const li = document.getElementById('li-' + id);
  if (li) li.className = val !== 'off' ? 'active-' + val : '';
  const radio = document.getElementById(id + '-' + val);
  if (radio) radio.checked = true;
  applyState(id);
  updateStats();
  save();
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = {};
  CONTROLS.forEach(function(c) {
    const hay = (c.label + ' ' + c.alias.join(' ') + ' ' + c.csf.join(' ') + ' ' +
      GRID.functions[c.fn] + ' ' + assetLabel(c)).toLowerCase();
    const hit = !q || hay.indexOf(q) !== -1;
    shown[c.id] = hit;
    const li = document.getElementById('li-' + c.id);
    if (li) li.classList.toggle('hidden-item', !hit);
  });
  groupsFor(groupMode).forEach(function(group) {
    const n = group.items.filter(c => shown[c.id]).length;
    const head = ul.querySelector('.group-head[data-group="' + group.name + '"]');
    if (head) {
      head.classList.toggle('hidden-item', n === 0);
      head.querySelector('.group-count').textContent = n;
    }
  });
}

document.getElementById('search').addEventListener('input', applyFilter);
document.querySelectorAll('.group-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    groupMode = btn.dataset.mode;
    renderList();
  });
});

CONTROLS.forEach(c => applyState(c.id));
renderList();
updateStats();

/* ── Templates & bulk actions ───────────────────────────────────────────── */
function applyTemplate(name, colorMode) {
  const tpl = TEMPLATES[name];
  if (!tpl) return;
  tpl.controls.forEach(function(id) {
    if (state[id] === 'off') setStatus(id, colorMode);
  });
  renderList();
}

function clearAll() {
  CONTROLS.forEach(c => setStatus(c.id, 'off'));
  renderList();
}

/* ── Export / import ────────────────────────────────────────────────────── */
function getClientName() {
  return document.getElementById('client-input').value.trim() || 'CDM';
}

// Render the matrix (plus Mason SC header) to a canvas, then hand it to cb().
function renderCanvas(cb) {
  const svg = document.getElementById('owasp-chart');
  const svgStr = new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = function() {
    const scale = 2; // retina quality
    const headerHeight = 80;
    const canvas = document.createElement('canvas');
    canvas.width  = img.naturalWidth  * scale;
    canvas.height = (img.naturalHeight + headerHeight) * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width / scale, canvas.height / scale);

    // Header with Mason SC branding
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 18px Rajdhani, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Mason SC', img.naturalWidth - 20, 30);
    ctx.font = '12px IBM Plex Mono, monospace';
    ctx.fillText('Cyber Defense Matrix · NIST CSF 2.0', img.naturalWidth - 20, 50);

    ctx.drawImage(img, 0, headerHeight);
    URL.revokeObjectURL(url);
    cb(canvas);
  };
  img.src = url;
}

function exportPNG() {
  renderCanvas(function(canvas) {
    canvas.toBlob(function(blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = getClientName().replace(/\s+/g, '-') + '-CDM.png';
      a.click();
      flashStatus();
    }, 'image/png');
  });
}

// Wrap the rendered matrix image in a single-page PDF (self-contained,
// embeds the picture as a JPEG image XObject — no print dialog, no libraries).
function exportPDF() {
  renderCanvas(function(canvas) {
    const jpeg = atob(canvas.toDataURL('image/jpeg', 0.95).split(',')[1]); // binary string, 1 char/byte
    const iw = canvas.width, ih = canvas.height;
    const margin = 18;
    const drawW = 760, drawH = drawW * ih / iw;
    const pageW = drawW + 2 * margin, pageH = drawH + 2 * margin;

    const objs = [
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW.toFixed(2) + ' ' + pageH.toFixed(2) +
        '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>',
      '<< /Type /XObject /Subtype /Image /Width ' + iw + ' /Height ' + ih +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length +
        ' >>\nstream\n' + jpeg + '\nendstream'
    ];
    const content = '0 0 0 rg 0 0 ' + pageW.toFixed(2) + ' ' + pageH.toFixed(2) + ' re f\n' +
      'q ' + drawW.toFixed(2) + ' 0 0 ' + drawH.toFixed(2) + ' ' + margin + ' ' + margin + ' cm /Im0 Do Q';
    objs.push('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');

    let pdf = '%PDF-1.4\n%\xFF\xFF\xFF\xFF\n';
    const offsets = [];
    for (let i = 0; i < objs.length; i++) {
      offsets.push(pdf.length);
      pdf += (i + 1) + ' 0 obj\n' + objs[i] + '\nendobj\n';
    }
    const xref = pdf.length;
    pdf += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    for (const o of offsets) pdf += String(o).padStart(10, '0') + ' 00000 n \n';
    pdf += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';

    const bytes = new Uint8Array(pdf.length);
    for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    a.download = getClientName().replace(/\s+/g, '-') + '-CDM.pdf';
    a.click();
    flashStatus();
  });
}

function flashStatus() {
  const el = document.getElementById('export-status');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function exportJSON() {
  const clientName = getClientName();
  const output = {
    client: clientName,
    framework: 'NIST CSF 2.0',
    exportedAt: new Date().toISOString(),
    controls: {}
  };
  CONTROLS.forEach(function(c) {
    output.controls[c.id] = {
      label: c.label,
      status: state[c.id],
      function: GRID.functions[c.fn],
      assetClass: assetLabel(c),
      csf: c.csf,
      alias: c.alias
    };
  });
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = clientName.replace(/\s+/g, '-') + '-CDM.json';
  a.click();
  flashStatus();
}

function triggerLoadJSON() {
  document.getElementById('json-file-input').click();
}

function loadFromJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.controls) throw new Error('Invalid format: missing controls key');
      if (data.client) document.getElementById('client-input').value = data.client;

      let loaded = 0, remapped = 0;
      Object.entries(data.controls).forEach(function(entry) {
        const rawId = entry[0], val = entry[1];
        const status = typeof val === 'string' ? val : (val.status || 'off');
        if (status === 'off') return;
        let id = rawId;
        if (!state.hasOwnProperty(id) && LEGACY_IDS[id]) { id = LEGACY_IDS[id]; remapped++; }
        if (!state.hasOwnProperty(id)) return;
        setStatus(id, status);
        loaded++;
      });
      renderList();

      const statusEl = document.getElementById('export-status');
      const errEl = document.getElementById('export-error');
      errEl.classList.remove('show');
      statusEl.textContent = '✓ Loaded ' + loaded + ' controls' +
        (remapped ? ' (' + remapped + ' mapped from the legacy list)' : '');
      statusEl.classList.add('show');
      setTimeout(function() {
        statusEl.classList.remove('show');
        statusEl.textContent = '✓ Downloaded';
      }, 3000);
    } catch (err) {
      const errEl = document.getElementById('export-error');
      errEl.textContent = '✗ ' + err.message;
      errEl.classList.add('show');
      setTimeout(() => errEl.classList.remove('show'), 3000);
    }
    event.target.value = ''; // reset so the same file can be reloaded
  };
  reader.readAsText(file);
}
</script>
