<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Cyber Defense Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
      background: #060810;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      background: #080c18;
      border-right: 1px solid rgba(59,130,246,0.2);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(59,130,246,0.15);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .brand-logo {
      width: 24px; height: 24px; object-fit: contain;
    }
    .brand-label { font-size: 14px; letter-spacing: 1px; color: #cbd5e1; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
    #client-input {
      width: 100%; background: transparent;
      border: none; border-bottom: 1px dashed rgba(148,163,184,0.25);
      color: #e2e8f0; font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 700; padding: 3px 0; outline: none;
    }
    #client-input:focus { border-bottom-color: #3b82f6; }

    #legend-bar {
      display: flex; gap: 10px; align-items: center;
      padding: 7px 16px;
      border-bottom: 1px solid rgba(59,130,246,0.1);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #cbd5e1; }
    .leg-swatch { width: 11px; height: 11px; border-radius: 2px; }
    .leg-swatch.green { background: #166534; border: 1px solid #22c55e; }
    .leg-swatch.blue  { background: #1e3a8a; border: 1px solid #3b82f6; }
    .leg-swatch.red   { background: #7f1d1d; border: 1px solid #ef4444; }

    #search-wrap {
      padding: 7px 12px;
      border-bottom: 1px solid rgba(59,130,246,0.1);
      flex-shrink: 0;
    }
    #search {
      width: 100%; background: rgba(15,23,42,0.8);
      border: 1px solid rgba(59,130,246,0.2); border-radius: 4px;
      padding: 7px 11px; color: #94a3b8;
      font-family: 'IBM Plex Mono', monospace; font-size: 14px; outline: none;
    }
    #search:focus { border-color: #3b82f6; color: #e2e8f0; }
    #search::placeholder { color: #334155; }

    #solution-checkboxes {
      list-style: none; overflow-y: auto; flex: 1; padding: 4px 0;
    }
    #solution-checkboxes::-webkit-scrollbar { width: 4px; }
    #solution-checkboxes::-webkit-scrollbar-track { background: #0d1117; }
    #solution-checkboxes::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 2px; }

    #solution-checkboxes li {
      display: flex; align-items: center;
      padding: 4px 12px;
      border-bottom: 1px solid rgba(30,58,138,0.1);
      gap: 6px; transition: background 0.1s;
    }
    #solution-checkboxes li:hover { background: rgba(30,58,138,0.12); }
    #solution-checkboxes li.hidden-item { display: none; }

    .sol-label {
      flex: 1; font-size: 14px; color: #cbd5e1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.15s;
    }
    li.active-green .sol-label { color: #4ade80; }
    li.active-blue  .sol-label { color: #93c5fd; }
    li.active-red   .sol-label { color: #fca5a5; }

    /* Radio dots */
    .radio-group { display: flex; gap: 4px; flex-shrink: 0; }
    .radio-group input[type="radio"] { display: none; }
    .radio-group label {
      display: block; width: 14px; height: 14px; border-radius: 3px;
      cursor: pointer; border: 1px solid transparent; transition: all 0.12s;
    }
    .lbl-off   { background: rgba(100,116,139,0.25); border-color: rgba(100,116,139,0.35) !important; }
    .lbl-green { background: rgba(22,101,52,0.45);   border-color: #22c55e !important; }
    .lbl-blue  { background: rgba(30,58,138,0.45);   border-color: #3b82f6 !important; }
    .lbl-red   { background: rgba(127,29,29,0.45);   border-color: #ef4444 !important; }
    input[type="radio"]:checked + label { transform: scale(1.2); box-shadow: 0 0 5px rgba(255,255,255,0.3); }

    /* ── MAIN ── */
    #main { overflow: auto; padding: 18px 12px; display: flex; flex-direction: column; }
    #title-bar { margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
    #title-bar h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 24px; font-weight: 700; color: #e2e8f0; letter-spacing: 2px;
    }
    #title-bar span { font-size: 13px; color: #cbd5e1; letter-spacing: 2px; }

    #templates-bar {
      margin-bottom: 16px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; max-width: 850px;
    }
    .template-group {
      display: flex; flex-direction: column; gap: 6px;
    }
    .template-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
      background: rgba(30,58,138,0.25); border: 1px solid rgba(59,130,246,0.35);
      color: #93c5fd; border-radius: 4px; padding: 8px 14px;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .template-btn:hover { background: rgba(30,58,138,0.4); }
    .template-btn:active { transform: scale(0.97); }
    .template-btn.clear-btn {
      background: rgba(239,68,68,0.25); border-color: rgba(239,68,68,0.35);
      color: #fca5a5;
    }
    .template-btn.clear-btn:hover { background: rgba(239,68,68,0.4); }
    .template-colors {
      display: flex; gap: 4px;
    }
    .color-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      border: none; border-radius: 3px; padding: 4px 10px;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .gap-btn { background: rgba(239,68,68,0.25); color: #fca5a5; }
    .gap-btn:hover { background: rgba(239,68,68,0.4); }
    .current-btn { background: rgba(30,58,138,0.25); color: #93c5fd; }
    .current-btn:hover { background: rgba(30,58,138,0.4); }
    .planned-btn { background: rgba(22,101,52,0.25); color: #4ade80; }
    .planned-btn:hover { background: rgba(22,101,52,0.4); }
    .color-btn:active { transform: scale(0.95); }

    #svg-wrap {
      background: #000;
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 4px; overflow: visible; max-width: 850px;
    }

    #stats-bar {
      margin-top: 12px; display: flex; gap: 40px; align-items: flex-start; justify-content: space-between; max-width: 850px;
    }
    .clear-all-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700;
      background: rgba(239,68,68,0.25); border: 2px solid rgba(239,68,68,0.35);
      color: #fca5a5; border-radius: 6px; padding: 18px 32px;
      cursor: pointer; transition: background 0.15s;
      flex-shrink: 0;
    }
    .clear-all-btn:hover { background: rgba(239,68,68,0.4); }
    .clear-all-btn:active { transform: scale(0.97); }
    #stats-pills {
      display: flex; flex-direction: column; gap: 10px; flex: 1;
    }
    #stats-pills > div {
      display: flex; gap: 8px; align-items: center;
    }
    .stat-pill { font-size: 13px; border-radius: 4px; padding: 5px 14px; border: 1px solid; }
    .stat-green { background: rgba(22,101,52,0.25);  border-color: rgba(34,197,94,0.35);  color: #4ade80; }
    .stat-blue  { background: rgba(30,58,138,0.25);  border-color: rgba(59,130,246,0.35); color: #93c5fd; }
    .stat-red   { background: rgba(127,29,29,0.25);  border-color: rgba(239,68,68,0.35);  color: #fca5a5; }
    .stat-off   { background: rgba(30,30,60,0.25);   border-color: rgba(100,116,139,0.3); color: #cbd5e1; }
    #export-bar-inner {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .export-label { font-size: 13px; letter-spacing: 2px; color: #cbd5e1; text-transform: uppercase; }
    .export-btn {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      background: rgba(30,58,138,0.2); border: 1px solid rgba(59,130,246,0.35);
      color: #93c5fd; border-radius: 4px; padding: 6px 16px;
      cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 6px;
    }
    .export-btn:hover { background: rgba(30,58,138,0.45); }
    .export-btn:active { transform: scale(0.97); }
    #export-status {
      font-size: 12px; color: #4ade80; letter-spacing: 1px;
      opacity: 0; transition: opacity 0.3s;
    }
    #export-status.show { opacity: 1; }
    #export-error { font-size: 12px; color: #fca5a5; letter-spacing: 1px; display: none; }
    #export-error.show { display: inline; }
    @media print {
      body { grid-template-columns: 1fr; background: #000; }
      #sidebar, #stats-bar, #export-bar, #title-bar { display: none !important; }
      #main { padding: 10px; }
      #svg-wrap { border: none; }
    }
  </style>
</head>

<!-- ── SIDEBAR ── -->
<aside id="sidebar">

  </div>

  <div id="legend-bar">
    <div class="leg"><div class="leg-swatch blue"></div>Current</div>
    <div class="leg"><div class="leg-swatch green"></div>Planned</div>
    <div class="leg"><div class="leg-swatch red"></div>Gap</div>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="Filter controls…" />
  </div>

  <ul id="solution-checkboxes"></ul>

// State
const state = {};
SOLUTIONS.forEach(s => state[s.id] = 'off');
try { Object.assign(state, JSON.parse(localStorage.getItem('cdm-svg-v2') || '{}')); } catch(e) {}

function save() {
  try { localStorage.setItem('cdm-svg-v2', JSON.stringify(state)); } catch(e) {}
}

function applyState(id) {
  const color = state[id];
  const g = document.getElementById(id);
  if (!g) return;
  const rect = g.querySelector('rect');
  const text = g.querySelector('text');
  if (!rect) return;
  if (color === 'off') {
    rect.style.display = 'none';
    if (text) text.style.display = 'none';
  } else {
    rect.style.display = '';
    if (text) text.style.display = '';
    rect.setAttribute('fill', COLOR_FILLS[color]);
    rect.setAttribute('stroke', COLOR_STROKES[color]);
  }
}

function updateStats() {
  const counts = { green: 0, blue: 0, red: 0, off: 0 };
  SOLUTIONS.forEach(s => counts[state[s.id]]++);
  document.getElementById('stat-blue').textContent  = `● ${counts.blue} Current`;
  document.getElementById('stat-green').textContent = `● ${counts.green} Planned`;
  document.getElementById('stat-red').textContent   = `● ${counts.red} Gap`;
  document.getElementById('stat-off').textContent   = `● ${counts.off} Off`;
}

const ul = document.getElementById('solution-checkboxes');

// Sort solutions alphabetically
const sortedSolutions = [...SOLUTIONS].sort((a, b) => a.label.localeCompare(b.label));

sortedSolutions.forEach(sol => {
  const li = document.createElement('li');
  li.id = `li-${sol.id}`;
  if (state[sol.id] !== 'off') li.className = `active-${state[sol.id]}`;

  const lbl = document.createElement('span');
  lbl.className = 'sol-label';
  lbl.textContent = sol.label;
  li.appendChild(lbl);

  const rg = document.createElement('div');
  rg.className = 'radio-group';

  [
    { val: 'off',   cls: 'lbl-off',   title: 'Off'     },
    { val: 'blue',  cls: 'lbl-blue',  title: 'Current' },
    { val: 'green', cls: 'lbl-green', title: 'Planned' },
    { val: 'red',   cls: 'lbl-red',   title: 'Gap'     },
  ].forEach(opt => {
    const inp = document.createElement('input');
    inp.type = 'radio';
    inp.name = `${sol.id}-color`;
    inp.id   = `${sol.id}-${opt.val}`;
    inp.value = opt.val;
    if (state[sol.id] === opt.val) inp.checked = true;

    const optLbl = document.createElement('label');
    optLbl.htmlFor = inp.id;
    optLbl.className = opt.cls;
    optLbl.title = opt.title;

    inp.addEventListener('change', () => {
      state[sol.id] = opt.val;
      const liEl = document.getElementById(`li-${sol.id}`);
      liEl.className = opt.val !== 'off' ? `active-${opt.val}` : '';
      applyState(sol.id);
      updateStats();
      save();
      sortAndReorderList();
    });

    rg.appendChild(inp);
    rg.appendChild(optLbl);
  });

  li.appendChild(rg);
  ul.appendChild(li);
  applyState(sol.id);
});

updateStats();

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  SOLUTIONS.forEach(sol => {
    const li = document.getElementById(`li-${sol.id}`);
    li.classList.toggle('hidden-item', !sol.label.toLowerCase().includes(q));
  });
});

function getClientName() {
  return document.getElementById('client-input').value.trim() || 'CDM';
}

function exportPNG() {
  const svg = document.getElementById('owasp-chart');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function() {
    const scale = 2; // retina quality
    const headerHeight = 80;
    const canvas = document.createElement('canvas');
    canvas.width  = img.naturalWidth  * scale;
    canvas.height = (img.naturalHeight + headerHeight) * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width / scale, canvas.height / scale);

    // Draw header with Mason SC branding
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 18px Rajdhani, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Mason SC', img.naturalWidth - 20, 30);
    ctx.font = '12px IBM Plex Mono, monospace';
    ctx.fillText('Cyber Defense Matrix', img.naturalWidth - 20, 50);

    // Draw matrix
    ctx.drawImage(img, 0, headerHeight);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = getClientName().replace(/\s+/g, '-') + '-CDM.png';
      a.click();
      flashStatus();
    }, 'image/png');
  };
  img.src = url;
}

function exportPDF() {
  window.print();
}

function flashStatus() {
  const el = document.getElementById('export-status');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function exportJSON() {
  const clientName = getClientName();
  const output = {
    client: clientName,
    exportedAt: new Date().toISOString(),
    controls: {}
  };
  SOLUTIONS.forEach(sol => {
    output.controls[sol.id] = {
      label: sol.label,
      status: state[sol.id]
    };
  });
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = clientName.replace(/\s+/g, '-') + '-CDM.json';
  a.click();
  flashStatus();
}

function triggerLoadJSON() {
  document.getElementById('json-file-input').click();
}

function loadFromJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.controls) throw new Error('Invalid format: missing controls key');

      // Restore client name
      if (data.client) {
        document.getElementById('client-input').value = data.client;
      }

      // Restore control states
      let loaded = 0;
      Object.entries(data.controls).forEach(([id, val]) => {
        const status = typeof val === 'string' ? val : (val.status || 'off');
        if (state.hasOwnProperty(id)) {
          state[id] = status;
          // Update radio button
          const radio = document.getElementById(id + '-' + status);
          if (radio) radio.checked = true;
          // Update li class
          const li = document.getElementById('li-' + id);
          if (li) li.className = status !== 'off' ? 'active-' + status : '';
          applyState(id);
          loaded++;
        }
      });

      updateStats();
      save();

      // Flash success
      const statusEl = document.getElementById('export-status');
      const errEl = document.getElementById('export-error');
      errEl.classList.remove('show');
      statusEl.textContent = '✓ Loaded ' + (data.client || file.name);
      statusEl.classList.add('show');
      setTimeout(() => {
        statusEl.classList.remove('show');
        statusEl.textContent = '✓ Downloaded';
      }, 2500);

    } catch(err) {
      const errEl = document.getElementById('export-error');
      errEl.textContent = '✗ ' + err.message;
      errEl.classList.add('show');
      setTimeout(() => errEl.classList.remove('show'), 3000);
    }
    // Reset input so same file can be reloaded
    event.target.value = '';
  };
  reader.readAsText(file);
}

function applyTemplate(templateName, colorMode) {
  const template = TEMPLATES[templateName];
  if (!template) return;

  template.controls.forEach(controlId => {
    // Only change if control is currently 'off'
    if (state[controlId] === 'off') {
      state[controlId] = colorMode; // 'red', 'green', or 'blue'
      applyState(controlId);
      const radio = document.getElementById(controlId + '-' + colorMode);
      if (radio) radio.checked = true;
      const li = document.getElementById('li-' + controlId);
      if (li) li.className = 'active-' + colorMode;
    }
  });

  updateStats();
  save();
  sortAndReorderList();
}

function clearAll() {
  SOLUTIONS.forEach(s => {
    state[s.id] = 'off';
    const li = document.getElementById('li-' + s.id);
    if (li) li.className = '';
    const radio = document.getElementById(s.id + '-off');
    if (radio) radio.checked = true;
    applyState(s.id);
  });
  updateStats();
  save();
  sortAndReorderList();
}

function sortAndReorderList() {
  const ul = document.getElementById('solution-checkboxes');
  const items = Array.from(ul.children);

  // Separate selected and unselected
  const selected = items.filter(li => li.className && li.className.includes('active-'));
  const unselected = items.filter(li => !li.className || !li.className.includes('active-'));

  // Sort unselected alphabetically by label
  unselected.sort((a, b) => {
    const labelA = a.querySelector('.sol-label').textContent.toLowerCase();
    const labelB = b.querySelector('.sol-label').textContent.toLowerCase();
    return labelA.localeCompare(labelB);
  });

  // Clear and rebuild list: selected first (in order they were selected), then unselected (alphabetical)
  ul.innerHTML = '';
  selected.forEach(li => ul.appendChild(li));
  unselected.forEach(li => ul.appendChild(li));
}
</script>
